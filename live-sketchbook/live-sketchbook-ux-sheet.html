/* Arte Kids Park design system · 컬러시스템 #26 LIGHT·VIVID · 흰 바탕, 1px 선, 장식 바 없음, 최소 13px */
/* layout: one reading column; sticky save/filter bar; each question is a bordered worksheet card with blanks */
:root{
  color-scheme:light;
  --bg:#FFFFFF;--ink:#111111;--ink-sub:#353535;--line:#D6D6D6;
  --c1-blue:#0065B2;--c2-yellow:#FFDF00;--c3-red:#E41E2E;--c4-green:#00913B;
  --c5-orange:#FF8000;--c6-pink:#ED92B9;--c7-sky:#62B5E5;--c8-teal:#00A7B5;
  --focus:var(--c1-blue);
  --font-sans:"LINE Seed Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --fs-min:13px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;
  --radius-sm:4px;--radius-md:8px;--radius-full:9999px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:24px;-webkit-font-smoothing:antialiased}
b,strong{font-weight:700}
a{color:var(--c1-blue)}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{max-width:1080px;margin:0 auto;padding-block:0 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{padding:32px 0 var(--space-6)}
.top h1{font-size:40px;line-height:48px;letter-spacing:-.02em;margin:0 0 var(--space-3);text-wrap:balance}
.eyebrow{display:flex;gap:var(--space-2);flex-wrap:wrap;margin:0 0 var(--space-3)}
.lede{max-width:78ch;margin:0 0 var(--space-2)}
.refs{font-size:14px;line-height:22px;color:var(--ink-sub);margin:0 0 var(--space-4)}
.akp-tag{display:inline-flex;align-items:center;padding:2px var(--space-2);border-radius:var(--radius-sm);font-size:var(--fs-min);line-height:18px;font-weight:700;background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;vertical-align:1px}
.akp-tag--info{background:var(--c1-blue);color:var(--bg);box-shadow:none}
.akp-tag--warning{background:var(--c5-orange);color:var(--ink);box-shadow:none}
.akp-badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 var(--space-2);border-radius:var(--radius-full);background:var(--c1-blue);color:var(--bg);font-size:var(--fs-min);font-weight:700;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3)}
.stat{border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4)}
.stat b{display:block;font-size:28px;line-height:36px;font-variant-numeric:tabular-nums}
.stat span{font-size:var(--fs-min);line-height:20px;color:var(--ink-sub)}
.stat.c1 b{color:var(--c1-blue)}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:var(--space-2) 0}
.barin{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2) var(--space-3);flex-wrap:wrap}
.barmsg{font-size:14px;line-height:22px;font-weight:700;min-width:0}
.barbtns{display:flex;gap:var(--space-2);flex-wrap:wrap}
.btn{font-size:var(--fs-min);line-height:18px;font-weight:700;padding:7px var(--space-3);border-radius:var(--radius-sm);border:0;background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.btn:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--ink-sub)}
.btn.pri{background:var(--c1-blue);color:var(--bg);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.filters{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-2)}
.fb{font-size:var(--fs-min);line-height:18px;font-weight:700;padding:4px var(--space-3);border-radius:var(--radius-full);border:0;background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.fb.on{background:var(--ink);color:var(--bg);box-shadow:none}
.jump{display:flex;gap:var(--space-1) var(--space-3);flex-wrap:wrap;font-size:var(--fs-min);line-height:20px;margin-left:var(--space-2)}
.jump a{color:var(--ink-sub);text-decoration:none;white-space:nowrap}
.jump a:hover{color:var(--c1-blue);text-decoration:underline}
.notice{border:1px solid var(--c5-orange);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);margin-top:var(--space-4);font-size:14px;line-height:22px}

/* sections */
.sec{padding-top:48px;scroll-margin-top:120px}
.shead{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.shead h2{font-size:28px;line-height:36px;margin:0}
.sprog{margin-left:auto;font-size:var(--fs-min);line-height:20px;color:var(--ink-sub);font-variant-numeric:tabular-nums}
.sdesc{color:var(--ink-sub);margin:var(--space-2) 0 var(--space-4);max-width:78ch}

/* item card */
.item{position:relative;border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-4) var(--space-6) var(--space-6);margin-bottom:var(--space-3);scroll-margin-top:120px}
.item[data-st="확정"]{border-color:var(--c1-blue)}
.ihead{display:flex;align-items:flex-start;gap:var(--space-3);flex-wrap:wrap}
.ino{font-size:var(--fs-min);line-height:28px;font-weight:700;color:var(--c1-blue);font-variant-numeric:tabular-nums;min-width:32px}
.ihead h4{flex:1;min-width:200px;font-size:20px;line-height:28px;margin:0}
.st{display:inline-flex;border-radius:var(--radius-full);box-shadow:inset 0 0 0 1px var(--line);padding:2px}
.stb{font-size:var(--fs-min);line-height:18px;font-weight:700;padding:4px var(--space-3);border-radius:var(--radius-full);border:0;background:transparent;color:var(--ink-sub);cursor:pointer}
.stb.on.s0{background:var(--ink-sub);color:var(--bg)}
.stb.on.s1{background:var(--c2-yellow);color:var(--ink)}
.stb.on.s2{background:var(--c1-blue);color:var(--bg)}
.why{font-size:14px;line-height:22px;color:var(--ink-sub);margin:var(--space-2) 0 var(--space-3) 44px;max-width:80ch}
.lab{font-size:var(--fs-min);line-height:18px;font-weight:700;color:var(--ink);margin:0 0 var(--space-2) 44px}
.lab em{font-style:normal;font-weight:400;color:var(--ink-sub);margin-left:var(--space-1)}
.opts{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-left:44px}
.opt{font-size:14px;line-height:20px;padding:6px var(--space-3);border-radius:var(--radius-full);border:0;background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;text-align:left}
.opt:hover{box-shadow:inset 0 0 0 1px var(--ink-sub)}
.opt.on{background:var(--c1-blue);color:var(--bg);box-shadow:none;font-weight:700}
.fields{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:var(--space-3);margin:var(--space-4) 0 0 44px}
.fmemo{grid-column:1 / -1}
.f{display:flex;flex-direction:column;gap:var(--space-1)}
.f span{font-size:var(--fs-min);line-height:18px;font-weight:700}
.f input{font-size:15px;line-height:22px;padding:7px 0;border:0;border-bottom:1px solid var(--ink-sub);border-radius:0;background:var(--bg);color:var(--ink);width:100%}
.f input::placeholder{color:#8A8A8A;letter-spacing:.1em}
.f input:focus-visible{outline:none;border-bottom:2px solid var(--c1-blue);padding-bottom:6px}
.f input:disabled{border-bottom-style:dashed;color:var(--ink-sub)}
.dirty{display:none;position:absolute;top:var(--space-4);right:var(--space-6);font-size:var(--fs-min);line-height:18px;font-weight:700;color:var(--c5-orange)}
.item.changed .dirty{display:block;position:static;margin:var(--space-3) 0 0 44px}

/* summary table */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;line-height:22px}
th{text-align:left;font-size:var(--fs-min);line-height:18px;color:var(--ink-sub);font-weight:700;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--ink-sub);white-space:nowrap}
td{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--c1-blue);white-space:nowrap}
.emptyrow{color:var(--ink-sub);text-align:center;padding:var(--space-6)}
.copyfall{width:100%;min-height:80px;font-size:13px}
.foot{margin-top:48px;border-top:1px solid var(--line);padding-top:var(--space-4);font-size:var(--fs-min);line-height:20px;color:var(--ink-sub)}

@media (max-width:720px){
  #app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top h1{font-size:28px;line-height:36px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item{padding:var(--space-3) var(--space-4) var(--space-4)}
  .why,.lab,.opts,.fields,.item.changed .dirty{margin-left:0}
  .fields{grid-template-columns:1fr}
  .jump{display:none}
  .shead h2{font-size:22px;line-height:30px}
}

var saved=JSON.parse(document.getElementById('ux-state').textContent||'{}');
saved.items=saved.items||{};saved.rev=saved.rev||'init';
var cur=JSON.parse(JSON.stringify(saved.items));
var changes={};           // id -> {field:true}
var art=null, readOnly=false, saving=false;
var filter='all';
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){return null;}}
function get(id){return cur[id]||(cur[id]={});}
function stOf(id){return (cur[id]&&cur[id].st)||'미정';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var ALL=[];SECTIONS.forEach(function(s,si){s.items.forEach(function(it,ii){it.no=(si+1)+'.'+(ii+1);it.sec=s;ALL.push(it);});});
var BYID={};ALL.forEach(function(it){BYID[it.id]=it;});

/* draft restore */
var draftRaw=ls('lsux-draft'),pending=ss('lsux-pending'),staleDraft=null;
try{var pd=pending&&JSON.parse(pending);if(pd&&pd.rev===saved.rev){ls('lsux-draft',null);draftRaw=null;}ss('lsux-pending',null);}catch(e){}
try{var dr=draftRaw&&JSON.parse(draftRaw);if(dr&&dr.changes&&Object.keys(dr.changes).length){if(dr.base===saved.rev)applyDraft(dr);else staleDraft=dr;}}catch(e){}
function applyDraft(dr){Object.keys(dr.changes).forEach(function(id){if(!BYID[id])return;var c=dr.changes[id];Object.keys(c).forEach(function(f){get(id)[f]=c[f];(changes[id]=changes[id]||{})[f]=true;});});}
function saveDraft(){var out={};Object.keys(changes).forEach(function(id){out[id]={};Object.keys(changes[id]).forEach(function(f){out[id][f]=get(id)[f];});});
  ls('lsux-draft',Object.keys(out).length?JSON.stringify({base:saved.rev,changes:out}):null);}
function setField(id,f,v){var o=get(id);o[f]=v;var sv=saved.items[id]||{};var same=JSON.stringify(sv[f]==null?'':sv[f])===JSON.stringify(v==null?'':v);
  if(same){if(changes[id]){delete changes[id][f];if(!Object.keys(changes[id]).length)delete changes[id];}}else (changes[id]=changes[id]||{})[f]=true;
  saveDraft();updateSummary();}

function optHtml(it){var o=get(it.id).opt,multi=!!it.multi,list=it.opts.concat(['기타']);
  return '<div class="opts" role="'+(multi?'group':'radiogroup')+'" aria-label="'+esc(it.q)+' 선택지">'+list.map(function(t){var on=multi?(Array.isArray(o)&&o.indexOf(t)>=0):o===t;
    return '<button type="button" class="opt'+(on?' on':'')+'" role="'+(multi?'checkbox':'radio')+'" aria-checked="'+on+'" data-opt="'+esc(t)+'">'+esc(t)+'</button>';}).join('')+'</div>';}
function stHtml(it){var s=stOf(it.id);return '<div class="st" role="radiogroup" aria-label="상태">'+STATUS.map(function(x,i){return '<button type="button" class="stb s'+i+(x===s?' on':'')+'" role="radio" aria-checked="'+(x===s)+'" data-st="'+x+'">'+x+'</button>';}).join('')+'</div>';}

  h+='<div class="bar" id="bar"><div class="barin"><span class="barmsg" id="barmsg"></span><span class="barbtns"><button type="button" class="btn" id="copy">확정 내용 복사</button><button type="button" class="btn" id="revert">변경 취소</button><button type="button" class="btn pri" id="save">모두에게 저장</button></span></div>'+
   '<div class="filters" role="group" aria-label="상태 필터"><button type="button" class="fb" data-fl="all">전체</button><button type="button" class="fb" data-fl="미정">미정</button><button type="button" class="fb" data-fl="검토 중">검토 중</button><button type="button" class="fb" data-fl="확정">확정</button><span class="jump">'+
   SECTIONS.map(function(s,i){return '<a href="#sec-'+s.id+'">'+(i+1)+' '+esc(s.t)+'</a>';}).join('')+'</span></div></div>';
  if(staleDraft)h+='<div class="notice" id="stale"><b>이 브라우저에 저장되지 않은 입력이 있습니다.</b> 그 사이 다른 사람이 저장해서 지금 보이는 내용이 더 최신입니다. 내 입력을 다시 얹을지 고르세요. <button type="button" class="btn" id="stApply">내 입력 다시 적용</button> <button type="button" class="btn" id="stDrop">버리기</button></div>';
  SECTIONS.forEach(function(s,i){h+='<section class="sec" id="sec-'+s.id+'"><div class="shead"><span class="akp-badge">'+(i+1)+'</span><h2>'+esc(s.t)+'</h2><span class="sprog" id="prog-'+s.id+'"></span></div><p class="sdesc">'+esc(s.d)+'</p>'+
    s.items.map(itemHtml).join('')+'</section>';});
  h+='<section class="sec" id="sec-summary"><div class="shead"><h2>확정된 결정</h2></div><p class="sdesc">상태가 ‘확정’인 항목만 모입니다. ‘확정 내용 복사’를 누르면 표 형식으로 복사되어 스프레드시트에 붙여 넣을 수 있습니다.</p><div class="tablewrap"><table><thead><tr><th>#</th><th>질문</th><th>선택</th><th>결정 내용</th><th>담당</th></tr></thead><tbody id="sumrows"></tbody></table></div></section>';
  h+='<footer class="foot">d\'strict · Arte Kids Park USA · 라이브 스케치북 UX 결정 시트<br><span id="savedAt"></span></footer>';
  app.innerHTML=h;applyFilter();updateSummary();
}
function optText(it){var o=get(it.id).opt;return Array.isArray(o)?o.join(', '):(o||'');}
function updateSummary(){var cnt={'미정':0,'검토 중':0,'확정':0};ALL.forEach(function(it){cnt[stOf(it.id)]++;});
  var st=document.getElementById('stats');if(st)st.innerHTML='<div class="stat"><b>'+ALL.length+'</b><span>전체 질문</span></div><div class="stat"><b>'+cnt['미정']+'</b><span>미정</span></div><div class="stat"><b>'+cnt['검토 중']+'</b><span>검토 중</span></div><div class="stat c1"><b>'+cnt['확정']+'</b><span>확정</span></div>';
  SECTIONS.forEach(function(s){var el=document.getElementById('prog-'+s.id);if(el){var d=s.items.filter(function(it){return stOf(it.id)==='확정';}).length;el.textContent='확정 '+d+' / '+s.items.length;}});
  var n=Object.keys(changes).length,msg=document.getElementById('barmsg'),sv=document.getElementById('save'),rv=document.getElementById('revert');
  if(msg){msg.textContent=readOnly?'보기 전용입니다. 입력은 이 브라우저에만 남고 다른 사람에게 보이지 않습니다.':!art?(n?'저장되지 않은 변경 '+n+'개 · 이 화면에서는 모두에게 저장할 수 없어 이 브라우저에만 남습니다.':'변경 없음'):saving?'저장 중…':(n?'저장되지 않은 변경 '+n+'개':'모든 변경이 저장되었습니다');}
  if(sv){sv.hidden=readOnly||!art;sv.disabled=!n||saving;}if(rv)rv.disabled=!n||saving;
  ALL.forEach(function(it){var el=document.getElementById('i-'+it.id);if(el){el.classList.toggle('changed',!!changes[it.id]);el.dataset.st=stOf(it.id);}});
  var rows=ALL.filter(function(it){return stOf(it.id)==='확정';}),tb=document.getElementById('sumrows');
  if(tb)tb.innerHTML=rows.length?rows.map(function(it){var v=get(it.id);return '<tr><td class="num">'+it.no+'</td><td>'+esc(it.q)+'</td><td>'+esc(optText(it))+'</td><td>'+esc(v.dec||'')+'</td><td>'+esc(v.own||'')+'</td></tr>';}).join(''):'<tr><td colspan="5" class="emptyrow">아직 확정된 항목이 없습니다. 항목의 상태를 ‘확정’으로 바꾸면 여기에 모입니다.</td></tr>';
  var sa=document.getElementById('savedAt');if(sa)sa.textContent=saved.savedAt?'마지막 저장 '+new Date(saved.savedAt).toLocaleString('ko-KR'):'아직 저장된 기록이 없습니다.';
}
function applyFilter(){[].forEach.call(document.querySelectorAll('.fb'),function(b){b.classList.toggle('on',b.dataset.fl===filter);b.setAttribute('aria-pressed',b.dataset.fl===filter);});
  [].forEach.call(document.querySelectorAll('.item'),function(el){el.hidden=filter!=='all'&&stOf(el.dataset.id)!==filter;});}

/* ---------- events ---------- */
app.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var item=b.closest('.item');
  if(item&&!readOnly){var id=item.dataset.id,it=BYID[id];
    if(b.dataset.opt!==undefined){var t=b.dataset.opt;if(it.multi){var a=Array.isArray(get(id).opt)?get(id).opt.slice():[];var k=a.indexOf(t);if(k>=0)a.splice(k,1);else a.push(t);setField(id,'opt',a.length?a:'');}
      else setField(id,'opt',get(id).opt===t?'':t);
      [].forEach.call(item.querySelectorAll('.opt'),function(x){var o=get(id).opt,on=it.multi?(Array.isArray(o)&&o.indexOf(x.dataset.opt)>=0):o===x.dataset.opt;x.classList.toggle('on',on);x.setAttribute('aria-checked',on);});
      if(t==='기타'){var d=item.querySelector('[data-f=dec]');if(d)d.focus();}return;}
    if(b.dataset.st){setField(id,'st',b.dataset.st==='미정'?'':b.dataset.st);[].forEach.call(item.querySelectorAll('.stb'),function(x){var on=x.dataset.st===stOf(id);x.classList.toggle('on',on);x.setAttribute('aria-checked',on);});applyFilter();return;}}
  if(b.dataset.fl){filter=b.dataset.fl;ls('lsux-filter',filter);applyFilter();return;}
  if(b.id==='save'){save();return;}
  if(b.id==='revert'){cur=JSON.parse(JSON.stringify(saved.items));changes={};saveDraft();render();return;}
  if(b.id==='copy'){copyTsv(b);return;}
  if(b.id==='stApply'){applyDraft(staleDraft);staleDraft=null;saveDraft();render();return;}
  if(b.id==='stDrop'){staleDraft=null;ls('lsux-draft',null);saveDraft();render();return;}
});
app.addEventListener('input',function(e){var el=e.target;if(!el.dataset||!el.dataset.f)return;var item=el.closest('.item');if(!item||readOnly)return;setField(item.dataset.id,el.dataset.f,el.value);});
function copyTsv(btn){var rows=[['#','영역','질문','선택','결정 내용','담당','메모']].concat(ALL.filter(function(it){return stOf(it.id)==='확정';}).map(function(it){var v=get(it.id);return[it.no,it.sec.t,it.q,optText(it),v.dec||'',v.own||'',v.memo||''];}));
  var tsv=rows.map(function(r){return r.map(function(c){return String(c).replace(/[\t\n]/g,' ');}).join('\t');}).join('\n');
  function fallback(){var ta=document.createElement('textarea');ta.value=tsv;ta.setAttribute('aria-label','복사할 내용');ta.className='copyfall';btn.parentNode.appendChild(ta);ta.select();btn.textContent='선택된 내용을 복사하세요';}
  try{navigator.clipboard.writeText(tsv).then(function(){btn.textContent='복사했습니다';setTimeout(function(){btn.textContent='확정 내용 복사';},1800);},fallback);}catch(err){fallback();}}

/* ---------- publish ---------- */
function buildDoc(state){var css=document.getElementById('ux-style').textContent,code=document.getElementById('ux-code').textContent;
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  return SKEL+'<title>라이브 스케치북 UX 결정 시트</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<style id="ux-style">'+css+'</style>\n<div id="app"></div>\n<script type="application/json" id="ux-state">'+json+'<\/script>\n<script id="ux-code">'+code+'<\/script>\n</body></html>';}
function clean(items){var out={};Object.keys(items).forEach(function(id){var v=items[id],o={};['opt','dec','own','memo','st'].forEach(function(f){if(v[f]&&(!Array.isArray(v[f])||v[f].length))o[f]=v[f];});if(Object.keys(o).length)out[id]=o;});return out;}
async function save(){if(!art||readOnly||saving||!Object.keys(changes).length)return;saving=true;updateSummary();
  var rev='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),next={rev:rev,savedAt:new Date().toISOString(),items:clean(cur)};
  ss('lsux-pending',JSON.stringify({rev:rev}));
  try{await art.publish(buildDoc(next));}
  catch(err){saving=false;ss('lsux-pending',null);var c=err&&err.code,msg=document.getElementById('barmsg');
    if(c==='conflict'){if(msg)msg.textContent='다른 사람이 먼저 저장했습니다. 최신 내용으로 다시 열리고, 내 입력은 ‘다시 적용’으로 되살릴 수 있습니다.';return;}
    if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){readOnly=true;render();return;}
    updateSummary();if(msg)msg.textContent=c==='rate_limited'?'저장이 너무 잦습니다. 잠시 뒤 다시 저장해 주세요.':c==='too_large'?'내용이 너무 커서 저장하지 못했습니다. 메모를 줄여 주세요.':'저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요. 입력은 이 브라우저에 남아 있습니다.';}
}

/* ---------- boot ---------- */
var f0=ls('lsux-filter');if(f0&&(f0==='all'||STATUS.indexOf(f0)>=0))filter=f0;
render();
if(window.claude&&window.claude.use){window.claude.use('artifact').then(function(a){art=a;updateSummary();}).catch(function(){art=null;updateSummary();});}
</script>
